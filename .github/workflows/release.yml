# Publishes a GitHub release with binaries for Windows, Linux and macOS when
# a version tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npx next typegen # route types (LayoutProps…) that tsc needs on a fresh checkout
          npx tsc --noEmit
          npx eslint .
          npm run build

      - name: Embed the web UI
        run: cp -r web/out/. internal/ui/dist/

      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
